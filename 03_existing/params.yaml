landscape:
  edge_paving: 1.5
  building_paving: 3.0
  paths:                                 # ESTIMATED from the top view (board registered to the survey grid, ±2.4 m; ground features do not lean)
    - [[40, -70], [47, -71], [52, 30], [45, 31]]             # path along B's west side
    - [[-41.1, -19.1], [39.5, -7.7], [41.6, -22.5], [-39.0, -33.9]]   # A10: paved forecourt / drop-off between A0 and block C (cars parked on the board)
    - [[18.2, 103.5], [-2.7, 69.6], [-5.3, 71.2], [15.6, 105.1]]   # A10: north park diagonal path, 3 m (board px 245,22 → 182,98)
    - [[-49.8, 80.7], [-25.3, 100.5], [-23.5, 98.1], [-48.0, 78.3]]   # A10: north park NW path, 3 m (board px 75,60 → 142,20)
  lawns:
    - [[-51.0, 93.7], [18.2, 106.6], [27.3, 57.7], [-43.8, 44.5]]
  courtyard_trees: {spacing: 12, height: [6, 11], seed: 7, clear: 5}
  context_tree_radius: 450

render:
  samples: 32
  sun_azimuth: 200
  sun_altitude: 42
  cameras:
    # CALIBRATED (P1, 2026-11-11) on SURVEYED references only: 14 roof corners of 11 RÚIAN buildings at their ČÚZK DMP 1G
    # main-roof height (03_existing/overlays/calib_render000_points.json, tools/calibrate_camera.py --points --only-manual)
    # -> 1.64 px RMS = 0.42 m at the site (0.254 m/px). Solved roll -0.07° (not representable, < 1 px at the frame edge).
    # (Audit camera 2026-11-09: 4.4 px RMS on hand-read OSM/archiMap points; earlier 76-78 mm cameras fitted our own model.)
    - {name: aerial_S_like_render000, location: [-90.37, -246.31, 208.68], target: [-57.91, -172.27, 149.83], lens: 35.244, resolution: [1280, 905]}
    - {name: street_SW_like_render005, location: [-74, -86, 1.7], target: [3.5, -37.5, 37], lens: 32.5, shift_y: 0.075, resolution: [1400, 1448]}   # cam_search after the audit geometry fix; client aspect 700x724
    # ESTIMATED from render-004: corner fit of tower B (nearest corner = SW, so the camera stands SW of B, not SE)
