# EXISTING SCHEME — client's current Panorama Pankrác design, rebuilt from the official renders (v1, full detail).
# Footprints: PSG website v3 fit (00_site/psg_panorama_blocks_v3.json) — ESTIMATED from renders.
# Storey counts: counted on the renders (03_existing/observations.md). Heights: PSG v3 estimates unless noted.
# Facade / roof / landscape parameters: ESTIMATED from renders (render-000…006, top view).
name: Panorama Pankrác — existing scheme (v1)
output_dir: model
site: {file: ../00_site/site.yaml}
rules: ../02_regulations/rules.yaml

exterior_wall: 0.35
slab_thickness: 0.30
roof: {parapet: 1.1}

buildings:
  # ---------------------------------------------------------------- A: diagrid tower (render-000, -005, -006, top view)
  - id: A
    name: Diagrid tower (T2)
    use: Residential / hotel tower
    # MEASURED (audit 2026-11-09): moved 4.15 m W, 10.0 m N of the PSG v3 fit. Calibrated aerial (render-000, camera solved on
    # context buildings, 4 px RMS) puts the roof/base corner at centre ≈ (2.7, 14.4); the lean-corrected top-view board gives
    # (4.6, 11.2). Shift limited to +10 m N so the facade keeps a 3 m gap to D (D verified in the same view).
    footprint: [[-16.13, 23.74], [16.9, 29.8], [23.19, -4.89], [-9.5, -10.62]]
    height: 83.8                         # ESTIMATED from render-006 + render-000: 7 diagrid modules x 3 storeys on the podium;
                                         # tower height/width ratio in render-006 gives ~3.7 m storeys (5.0 + 21 x 3.7 + 1.1 parapet). Was 88.2 (PSG v3 estimate), which put the roof ~2
                                         # storeys above the client's in the tuned aerial and above D in render-003.
    notes: 22 storeys = podium level + 21 tower floors (7 diagrid modules x 3, counted in render-006 and render-000)
    storeys:
      - {name: P1, height: 5.0, use: Lobby}
      - {name: P2, height: 3.7, use: Amenities}   # ASSUMED: same as typical storey so the 3-storey diagrid modules are equal
      - {name: L, count: 20, start: 3, height: 3.7, use: Units}   # ESTIMATED from render-006 height/width ratio
    facade:
      - {type: curtain, glass: Glass, mullion: 1.6}
      - {type: balcony, from: 3, depth: 1.7, railing_material: Glass dark}
      - {type: diagrid, from: 2, offset: 1.9, bays: 5, storeys_per_module: 3, member: [0.45, 0.55], above_roof: 1.1, material: Steel white}
    roof:
      parapet: 1.1
      parapet_material: Steel white
      structures:                        # top view: central raised green square + 3 plant boxes
        - {name: green box, dx: 0, dy: 0, w: 10, d: 10, h: 2.4, green: true, material: Render grey}
        - {name: plant, dx: -9, dy: 11.5, w: 3.2, d: 3.2, h: 2.4}
        - {name: plant, dx: -3, dy: 11.5, w: 3.2, d: 3.2, h: 2.4}
        - {name: plant, dx: 9, dy: 11.5, w: 4.5, d: 3.2, h: 2.4}
      pv: {azimuth: building, tilt: 10, row: 2.0, gap: 0.7}

  - id: A0
    name: Diagrid tower podium + courtyard link
    use: Lobby / restaurant
    # MEASURED (audit): podium re-drawn around the moved tower A (+3 m) plus the original link strip to the east
    footprint: [[-12.5, -13.62], [-11.99, -13.53], [-19.52, 25.46], [-15.47, 26.91], [9.38, 31.47], [19.57, 31.88], [26.68, -7.32], [26.28, -7.39], [30.0, -29.3], [26.68, -29.44], [48.0, -32.0], [46.5, -41.0], [-9.5, -31.0]]
    notes: ESTIMATED glazed single-storey base with green roof and timber fascia (render-006, render-000 link)
    storeys:
      - {name: GF, height: 5.0, use: Lobby / restaurant}
    facade:
      - {type: curtain, glass: Glass dark, mullion: 2.4}
    roof: {parapet: 0.6, parapet_material: Timber, green: true}

  # ---------------------------------------------------------------- B: green tower on base (render-000, -002, -004)
  - id: B
    name: Green tower (E residential tower)
    use: Residential
    footprint: [[55.1, -16.66], [81.29, -11.74], [88.95, -48.07], [61.76, -53.62]]
    height: 68.9                         # PSG v3 estimate
    notes: 22 storeys; storeys 1–6 = timber-fin base widened 4 m to the west, 7–22 = tower with planted balconies
    setbacks:
      - {facing: W, distance: -4.0, from: 1, to: 6}
    storeys:
      - {name: GF, height: 4.5, use: Retail / lobby}
      - {name: L, count: 21, height: 3.0, use: Apartments}
    facade:
      - {type: curtain, from: 1, to: 1, glass: Glass dark}
      - {type: curtain, from: 2, to: 6, glass: Glass, mullion: 1.5}
      - {type: fins, from: 2, to: 6, spacing: 1.5, width: 0.28, depth: 0.35, material: Timber}
      - {type: band, from: 2, to: 6, depth: 0.3, thickness: 0.3, material: Concrete white}
      - {type: curtain, from: 7, glass: Glass, mullion: 1.5}
      - {type: balcony, from: 7, depth: 1.6, planter: true, planter_material: Concrete white}
      - {type: band, from: 7, every: 2, depth: 1.9, thickness: 0.5, material: Concrete white}
      - {type: fins, from: 7, spacing: 0.9, width: 0.06, depth: 0.25, offset: 1.3, material: Aluminium white}
    terrace_edge: {planter: true, railing: true}
    roof:
      parapet: 1.0
      parapet_material: Concrete white
      structures:
        - {name: plant, dx: 4, dy: -3, w: 6, d: 4, h: 2.6}
        - {name: plant, dx: -6, dy: 5, w: 3, d: 3, h: 2.6}
      pv: {azimuth: building, tilt: 10, row: 2.0, gap: 1.0}

  - id: B2
    name: Terraced block (E)
    use: Residential
    # MEASURED (audit): south face ~8 m further north and east end ~5 m further west than the PSG fit (calibrated aerial:
    # terrace edge SW (65.9, -68.5), SE (100.4, -61.3), vertical check 25.8 m); now inside the official plot.
    footprint: [[68.0, -66.2], [65.79, -52.87], [89.04, -48.54], [82.15, -11.58], [94.48, -9.26], [99.45, -60.31]]
    height: 26.9                         # PSG v3 estimate (top terrace level)
    notes: >-
      8 storeys, straight walls (render-000 aerial, render-004): deep white balcony slabs with planters on every floor,
      timber piers between bays, set-back penthouse with PV in the SE corner, roof terrace around it.
      Was modelled stepping back 1 m per floor to S and E, which read as a tilted pyramid; not in the renders.
    storeys:
      - {name: GF, height: 4.5, use: Retail}
      - {name: L, count: 6, start: 1, height: 3.0, use: Apartments}
      # MEASURED (audit, calibrated aerial): PV penthouse ≈ 26 x 9.5 m along tower B's south face, terrace to the south
      - {name: PH, height: 3.0, use: Apartments, footprint: [[72.0, -61.5], [69.8, -52.8], [96.4, -47.2], [97.8, -55.3]]}
    facade:
      - {type: curtain, from: 1, to: 1, glass: Glass dark}
      - {type: curtain, from: 2, glass: Glass, mullion: 1.8}
      # ESTIMATED from render-004 / render-000: ~2.2 m deep slabs wrapping the street faces, planters + glass railing
      # (N faces are against tower B / B3, so not included)
      - {type: balcony, from: 2, to: 7, facing: [S, E, W], depth: 2.2, thickness: 0.35, planter: true, railing: true, planter_material: Concrete white}
      # ESTIMATED from render-004: timber piers between bays, full balcony depth
      - {type: fins, from: 2, to: 7, facing: [S, E, W], spacing: 4.2, width: 0.45, depth: 2.2, offset: 0, material: Timber}
    terrace_edge: {planter: true, railing: true}
    roof:
      parapet: 0.6
      parapet_material: Concrete white
      pv: {azimuth: building, tilt: 12, row: 2.0, gap: 0.6}

  - id: B3
    name: Podium north (E)
    use: Residential
    footprint: [[58.9, -15.92], [56.34, -2.15], [88.94, 3.92], [91.44, -9.85]]
    height: 19.2                         # PSG v3 estimate
    notes: 5 storeys; base expression as B (timber fins)
    storeys:
      - {name: GF, height: 4.5, use: Retail}
      - {name: L, count: 4, height: 3.3, use: Apartments}
    facade:
      - {type: curtain, from: 1, to: 1, glass: Glass dark}
      - {type: curtain, from: 2, glass: Glass, mullion: 1.5}
      - {type: fins, from: 2, spacing: 1.5, width: 0.28, depth: 0.35, material: Timber}
      - {type: band, from: 2, depth: 0.3, thickness: 0.3, material: Concrete white}
    roof: {parapet: 0.9, parapet_material: Concrete white, green: true}

  # ---------------------------------------------------------------- C: front block (render-000, -002, -005)
  - id: C1
    name: Front slab — west head (T5)
    use: Hotel / office
    footprint: [[-32.57, -39.21], [-11.26, -35.24], [-12.67, -59.62], [-28.08, -58.73]]
    height: 33.9
    notes: 11 storeys (render-005 - 10 window rows over a tall glazed GF); light grey fins + horizontal bands, green roof with rooftop units
    storeys:
      - {name: GF, height: 4.4, use: Lobby}            # ESTIMATED from render-005: GF ≈ 1.5 x typical storey
      - {name: L, count: 10, height: 2.85, use: Rooms}  # ESTIMATED from render-005: 10 window rows; height kept at 33.9 m
    windows: {width: 1.4, height: 2.0, sill: 0.7, spacing: 2.7, edge_margin: 1.0}
    material: Render light grey
    facade:
      - {type: curtain, from: 1, to: 1, glass: Glass dark, mullion: 3.0}
      - {type: fins, from: 2, spacing: 2.7, width: 0.35, depth: 0.45, material: Aluminium white}
      - {type: band, from: 2, depth: 0.45, thickness: 0.3, material: Aluminium white}
    roof:
      parapet: 1.0
      parapet_material: Render grey
      green: true
      structures:                        # render-000: dark core box + rooftop units
        - {name: core, dx: -2, dy: 3, w: 7, d: 6, h: 3.5, material: Render grey}
        - {name: plant, dx: -7, dy: -3, w: 2.5, d: 2.5, h: 1.8, material: Aluminium}
        - {name: plant, dx: -3, dy: -4, w: 2.5, d: 2.5, h: 1.8, material: Aluminium}
        - {name: plant, dx: 2, dy: -4, w: 2.5, d: 2.5, h: 1.8, material: Aluminium}
        - {name: plant, dx: 6, dy: -2, w: 2.5, d: 2.5, h: 1.8, material: Aluminium}

  - id: C2
    name: Front slab — wing (T5)
    use: Hotel / office
    footprint: [[-11.26, -35.24], [37.83, -48.86], [36.23, -62.45], [-12.67, -59.62]]
    height: 33.9                         # renders: continuous cornice with C1 (PSG v3 had 25.1 m) — VERIFY
    notes: 11 storeys, window rows continuous with C1 (render-005); top floor set back 4 m on the north (roof terraces, render-000)
    setbacks:
      - {facing: N, distance: 4.0, from: 11, to: 11}
    storeys:
      - {name: GF, height: 4.4, use: Lobby / retail}   # ESTIMATED from render-005, same levels as C1
      - {name: L, count: 10, height: 2.85, use: Rooms}
    windows: {width: 1.4, height: 2.0, sill: 0.7, spacing: 2.7, edge_margin: 1.0}
    material: Render light grey
    facade:
      - {type: curtain, from: 1, to: 1, glass: Glass dark, mullion: 3.0}
      - {type: fins, from: 2, spacing: 2.7, width: 0.35, depth: 0.45, material: Aluminium white}
      - {type: band, from: 2, depth: 0.45, thickness: 0.3, material: Aluminium white}
    terrace_edge: {planter: true, railing: true}
    roof: {parapet: 1.0, parapet_material: Render grey, green: true}

  # ---------------------------------------------------------------- D: butterfly office (render-003, top view)
  - id: D
    name: Butterfly office (T1 bow-tie)
    use: Office
    # ESTIMATED from render-003: recessed vertical slot at the joint of the two wings on the north face
    # (~7 m wide, 3 m deep: 3.5 m each side of the joint vertex (-7.31, 47.16)), with green balconies inside
    footprint: [[-42.29, 42.65], [-10.78, 46.71], [-10.78, 43.71], [-3.91, 44.99], [-3.91, 47.99], [27.42, 55.64], [31.58, 33.37], [-4.47, 31.91], [-38.05, 19.89]]
    height: 32.3                         # ESTIMATED from render-003: GF ≈ 1.9 x typical pitch + 7 x 3.45 + 1.6 parapet band;
                                         # the iteration-1 camera fit had the 34.0 m model ~6 % taller than the client image
    notes: 8 storeys (render-003 - 7 ribbon-glazed office floors over a tall recessed GF); white horizontal bands; sawtooth PV roof (top view)
    setbacks:
      - {facing: [N, E], distance: 3.0, from: 1, to: 1}   # ESTIMATED from render-003: upper floors overhang the recessed GF
    storeys:
      - {name: GF, height: 6.5, use: Lobby}               # ESTIMATED from render-003: ≈1.9 x typical storey
      - {name: L, count: 7, height: 3.45, use: Offices}   # ESTIMATED from render-003: 7 ribbon-glazing rows
    facade:
      - {type: curtain, glass: Glass, mullion: 1.35, spandrel: 1.0}
      - {type: band, from: 2, depth: 0.7, thickness: 0.55, material: Aluminium white}
      # ESTIMATED from render-003: planted balconies stacked in the joint recess (back wall of the slot only)
      - {type: balcony, from: 2, near: [-7.3, 44.35], depth: 2.0, planter: true, railing: true, planter_material: Aluminium white}
    roof:
      parapet: 1.6                         # ESTIMATED from render-003: tall white parapet band
      parapet_material: Aluminium white
      sawtooth: {azimuth: 180, tilt: 22, row: 3.6, gap: 0.3, material: PV}

  # ---------------------------------------------------------------- E: existing corner office on 1133/12 (kept)
  - id: E
    name: Existing corner office (parcel 1133/12)
    existing: true
    use: Office (existing, kept)
    # AUDIT: OSM polygon trimmed at y ≈ -6.9. Its 45 m wedge south to (106.73, -53.17) is ramp/greenery on the ČÚZK
    # orthophoto (00_site/survey/grid_ortho.jpg), not building; render-002 shows a compact block.
    footprint: [[94.76, 12.3], [125.82, 18.02], [126.85, 12.26], [125.39, 12.02], [125.78, 10.41], [131.87, 11.17], [125.83, -4.35], [120.4, -5.47], [120.42, -6.96], [119.35, -7.83], [117.94, -7.24], [117.57, -5.99], [110.95, -6.87], [98.27, -6.87]]
    height: 32.0                         # OSM / archiMap
    notes: Existing building kept in the client scheme (render-002); dark glass, white frame, bronze crown
    storeys:
      - {name: GF, height: 4.5, use: Lobby}
      - {name: L, count: 8, height: 3.3, use: Offices}
    facade:
      - {type: curtain, glass: Glass dark, mullion: 1.5, spandrel: 0.9}
      - {type: fins, spacing: 6.0, width: 0.5, depth: 0.4, material: Aluminium white}
      - {type: band, from: 2, depth: 0.35, thickness: 0.4, material: Aluminium white}
    roof:
      parapet: 1.6
      parapet_material: Bronze
      structures:
        - {name: plant, dx: 0, dy: 0, w: 9, d: 5, h: 2.5, material: Aluminium}

  # ---------------------------------------------------------------- U: underground parking (ASSUMED)
  - id: U
    name: Underground parking
    use: Parking / technical
    footprint: [[-49.78, 14.14], [-50.12, 11.75], [-49.3, 10.76], [-36.74, -55.39], [-37.61, -57.3], [53.85, -69.64], [33.28, 43.14], [-51.67, 24.54]]
    ground_elevation: -7.0
    notes: ASSUMED 2 basement levels under parcels 1051/3, 1090/2, 1051/16 (ramp + cars in top view) — VERIFY
    windows: false
    material: Concrete grey
    storeys:
      - {name: B, count: 2, height: 3.5, use: Parking}
    roof: {parapet: 0, slab: false}

landscape:
  edge_paving: 1.5
  building_paving: 3.0
  paths:                                 # ESTIMATED from the top view
    - [[40, -70], [47, -71], [52, 30], [45, 31]]
    - [[-45, -20], [55, -36], [56, -31], [-44, -15]]
  lawns:
    - [[-51.0, 93.7], [18.2, 106.6], [27.3, 57.7], [-43.8, 44.5]]
  courtyard_trees: {spacing: 12, height: [6, 11], seed: 7, clear: 5}
  context_tree_radius: 450

render:
  samples: 32
  sun_azimuth: 200
  sun_altitude: 42
  cameras:
    # CALIBRATED (audit) on context only: 6 slab-block roof corners, 2 drum roofs, 104 m tower edges -> 4.4 px RMS.
    # (Earlier 78 mm / 76 mm cameras were tuned on our own buildings and absorbed their errors.)
    - {name: aerial_S_like_render000, location: [-93.67, -255.78, 218.91], target: [14.88, -5.5, 20], lens: 36.86, resolution: [1280, 905]}
    - {name: street_SW_like_render005, location: [-74, -86, 1.7], target: [3.5, -37.5, 37], lens: 32.5, shift_y: 0.075, resolution: [1400, 1448]}   # cam_search after the audit geometry fix; client aspect 700x724
    # ESTIMATED from render-004: corner fit of tower B (nearest corner = SW, so the camera stands SW of B, not SE)
    - {name: street_SE_like_render004, location: [-7.9, -119.7, 1.7], target: [42.1, -70.9, 4.7], lens: 40.5, shift_y: 0.454, resolution: [1244, 1484]}   # cam_search after the audit; client aspect 622x742
    # Corner fit on tower A (front = SW corner, 5 points, 14 px RMS). The client render omits block C (C1 would hide A's base
    # from here), so C1/C2 are hidden for this camera only.
    - {name: dusk_diagrid_like_render006, location: [-56.0, -88.2, 1.7], target: [-22.4, -33.7, 22.8], lens: 34.4, shift_y: -0.013, hide: [C1, C2], resolution: [1086, 1742]}   # + cam_search; client aspect 543x871
    # ESTIMATED from render-003: least-squares fit of D's corners (NE/NW parapet + underside, joint, SE) at eye height,
    # level camera with vertical shift (client uses 2-point perspective); residuals ~10 px on 990x450. Camera stands NE of D.
    - {name: park_N_like_render003, location: [20.1, 108.6, 1.7], target: [1.4, 51.6, 1.7], lens: 19.6, shift_y: 0.153, hide: [A], resolution: [1980, 900]}   # client render omits tower A (it must be visible above D from here)
    - {name: top_view, location: [40, -10, 600], target: [40, -9.99, 0], lens: 35}
