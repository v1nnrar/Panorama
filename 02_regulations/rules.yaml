# Metropolitan Plan of Prague (Metropolitní plán, MPP) — in force since 1 Sep 2026 (issued 28 May 2026).
# Site: Panorama Pankrác plot (11 ČÚZK parcels) — locality 058 / Horní Pankrác, stabilised part [S],
# hybrid structure (03), residential-buildable. Sources in 02_regulations/raw/ (text, KLZ 058, table appendix).
# Squares checked: S-JTSK 100 m squares E -742273..-741973 / N -1047495..-1047295 (see summary.md).
rules:
  - id: max_height
    label: Max regulated building height (storey range 27)
    metric: height_top_of_parapet_m
    max: 100
    source: "MPP text čl. 98 odst. 3 (range 27: >21 RNP, max 100 m); Z 02 / KLZ 058 map — squares over the plot read 27"
  - id: max_storeys
    label: Max regulated above-ground storeys (range 27)
    metric: storeys_above_ground
    max: 27
    source: "MPP čl. 98 odst. 3 — INTERPRETATION: range label 27 = maximum RNP (ranges 21 = 13–21, 15 = 10–15 …)"
  - id: hppreg_info
    label: Regulated floor area (HPPreg) — not set in stabilised areas
    metric: gfa_m2
    source: "MPP čl. 96 odst. 2: HPPreg/Zmax apply only to [T] and [R] areas; plot is [S] (KLZ 058 map, no T hatch)"
  # --- Prague building regulations (PSP, nař. 12/2024, consolidated text 2025/01 in raw/PSP_souhrnne_zneni.pdf) ---
  - id: psp21_distance_angle
    label: "PSP §21: neighbour windows failing the 45°/45° distance angle"
    metric: psp21_windows_failing
    max: 0
    source: "PSP §21 odst. 1 + příloha 1 bod II (sampled windows on neighbour façades facing the plot; pipeline/psp.py)"
  - id: psp22_boundary
    label: "PSP §22: min distance to private neighbouring plots (m)"
    metric: psp22_min_boundary_distance_m
    min: 2.0
    source: "PSP §22 odst. 2 — ASSUMED: plot edges facing S (Milevská) and E (street/metro) are public space"
  - id: psp25_parking
    label: "PSP §25: parking capacity minus required minimum (spaces)"
    metric: parking_margin
    min: 0
    source: "PSP §25 + příloha 2 (HPP per space by use) + příloha 3 — ASSUMED zone 02 (bound 80 %, visitor 15–55 %), 30 m²/space at 85 % basement efficiency"
