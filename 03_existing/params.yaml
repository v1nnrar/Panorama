    # (Was the trimmed OSM polygon, whose west wall sat 3–4 m too far east.)
    footprint: [[90.8, 3.7], [92.4, 4.0], [91.0, 11.4], [125.3, 17.7], [126.3, 12.2], [124.6, 11.8], [125.0, 10.0], [132.0, 11.0], [124.7, -4.6], [118.3, -5.8], [118.4, -7.2], [117.2, -8.2], [115.9, -7.9], [115.2, -6.4], [107.3, -7.5], [92.84, -7.5]]
    height: 29.2                         # MEASURED P4: calibrated render-000, roof edge on the verticals of the RÚIAN NE / SE corners = 30.0 / 28.3 m (miss 3–4 px); OSM had 32.0. RÚIAN: 12 storeys incl. lower levels; ground level unknown (terrain model predates E)
    notes: Existing building kept in the client scheme (render-002); dark glass, white frame, bronze crown
    cores: [{dx: 0.0, dy: 0.0, w: 8, d: 10, note: 2 stairs + 3 lifts}]   # ASSUMED (B1): plausible core position/size (local frame of the GF footprint), not from client drawings
    storeys:
      - {name: GF, height: 4.5, use: Lobby}
      - {name: L, count: 8, height: 3.3, use: Offices}
    facade:
      - {type: curtain, glass: Glass dark, mullion: 1.5, spandrel: 0.9}
      - {type: fins, spacing: 6.0, width: 0.5, depth: 0.4, material: Aluminium white}
      - {type: band, from: 2, depth: 0.35, thickness: 0.4, material: Aluminium white}
    roof:
      parapet: 1.6
